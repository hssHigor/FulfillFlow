services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfillflow-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillflow}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fulfillflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fulfillflow} -d ${POSTGRES_DB:-fulfillflow}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: