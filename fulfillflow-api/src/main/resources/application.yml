spring:
  application:
    name: fulfillflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillflow}
    username: ${DB_USERNAME:fulfillflow}
    password: ${DB_PASSWORD:fulfillflow}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info